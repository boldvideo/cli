name: Release

on:
  push:
    tags: [v*]
  # A manual run stages nothing. It only asks npm whether it trusts this workflow
  # for each package, which is the question a failed staging leaves open.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trust:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Ask npm whether it trusts this workflow
        run: |
          curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" > id.json
          # What npm compares with the trusted publisher. None of this is secret.
          node -e '
            const claims = JSON.parse(Buffer.from(require("./id.json").value.split(".")[1], "base64url"));
            for (const name of ["sub", "repository", "repository_id", "repository_owner", "repository_owner_id", "repository_visibility", "workflow_ref", "job_workflow_ref", "ref", "event_name", "environment", "runner_environment"])
              console.log(name.padEnd(22), claims[name] ?? "(none)");
          '
          failed=0
          for package in boldvideo @boldvideo%2fcli; do
            status=$(node -e '
              fetch("https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/" + process.argv[1], {
                method: "POST",
                headers: { Authorization: "Bearer " + require("./id.json").value },
              }).then(async (response) => {
                // A yes comes with a short-lived token. It is dropped here, never printed.
                const body = await response.json().catch(() => ({}));
                console.log(response.status + " " + (response.ok ? "trusted" : (body.message ?? "refused")));
              });
            ' "$package")
            echo "$package: $status"
            case "$status" in 2*) ;; *) failed=1 ;; esac
          done
          rm -f id.json
          exit $failed

  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify tag matches package version
        run: |
          expected=$(node -p '"v" + require("./package.json").version')
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)."
            exit 1
          fi
          node -e 'const main = require("./package.json"); const alias = require("./packages/cli-alias/package.json"); if (alias.version !== main.version || alias.dependencies.boldvideo !== main.version) { console.error("Alias version and dependency must match package.json version"); process.exit(1); }'

  check:
    needs: version
    uses: ./.github/workflows/ci.yml

  # CI can only stage a release. A maintainer approves it on npmjs.com with 2FA
  # (Staged Packages), so a compromised workflow cannot ship to users by itself.
  stage:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC); no token is stored anywhere
    steps:
      - uses: actions/checkout@v4
      # setup-node v4 exports a placeholder NODE_AUTH_TOKEN whenever registry-url is
      # set, and any token shadows trusted publishing: npm then answers E401.
      # Same setup as the bold-js release, which publishes this way.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Use an npm that can stage
        run: |
          npm install --global npm@11.18.0
          node -e 'const [major, minor] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && minor < 15)) { console.error("npm stage needs npm 11.15 or newer, found " + process.argv[1]); process.exit(1); }' "$(npm --version)"
      - run: bun install --frozen-lockfile
      - name: Refuse to run with an npm token present
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NODE_AUTH_TOKEN is set. Trusted publishing needs no token, and a token overrides it."
            exit 1
          fi
      - name: Stage boldvideo
        run: npm stage publish --access public --loglevel verbose
      - name: Stage @boldvideo/cli
        working-directory: packages/cli-alias
        run: npm stage publish --access public --loglevel verbose
      - name: Say what happens next
        run: |
          {
            echo "### Staged ${GITHUB_REF_NAME}"
            echo "Nothing is public yet. Approve \`boldvideo\` first, then \`@boldvideo/cli\`, on npmjs.com under Staged Packages, or with \`npm stage list\` and \`npm stage approve <stage-id>\`."
            echo "Then run the Smoke workflow for this version."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: stage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
      - name: Create GitHub release with checked tarballs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # release-binaries.yml runs on the same tag and may have created the release already.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" boldvideo-*.tgz --clobber
