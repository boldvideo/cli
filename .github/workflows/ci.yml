name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: bun test
      - run: bun run ci:lint
      - run: bun run release:check
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: package
          path: boldvideo-*.tgz

  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run docs:reference
      - run: git diff --exit-code -- docs/cli-reference.md

  smoke:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: package
      - run: |
          package=$(echo boldvideo-[0-9]*.tgz)
          export EXPECTED_VERSION=$(tar -xOf "$package" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          npx --yes "./$package" --version > version.json
          node -e 'if (JSON.parse(require("fs").readFileSync("version.json", "utf8")).version !== process.env.EXPECTED_VERSION) process.exit(1)'
          npx --yes "./$package" --help > help.json
          node -e 'const help = JSON.parse(require("fs").readFileSync("help.json", "utf8")); if (help.name !== "boldvideo" || !help.subcommands.some(c => c.name === "help")) process.exit(1)'
          npm install --prefix alias-smoke --ignore-scripts --no-audit --no-fund "./$package" ./boldvideo-cli-*.tgz
          node alias-smoke/node_modules/@boldvideo/cli/bin/boldvideo.js --version > alias-version.json
          node -e 'if (JSON.parse(require("fs").readFileSync("alias-version.json", "utf8")).version !== process.env.EXPECTED_VERSION) process.exit(1)'
